version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  frontend:
    build:
      context: ../front end
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
